name: Application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/stock_prediction_test
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/stock_prediction_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: isolated-ci-secret-at-least-32-characters
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stock_prediction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d stock_prediction_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check --select E9,F app scripts tests analysis_tests
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../requirements.lock
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: frontend/test-results/

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t algopredict-api:ci .
      - run: docker build -t algopredict-frontend:ci frontend
